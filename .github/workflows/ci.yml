name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Format and static analysis
        run: ./gradlew spotlessCheck detekt lint --no-daemon

      - name: Tests and coverage gates
        run: ./gradlew check koverVerify --no-daemon

      - name: Assemble release
        run: ./gradlew :android:app:assembleRelease --no-daemon

      - name: Guards
        run: |
          scripts/check-apk-size.sh
          scripts/check-forbidden-strings.sh
          scripts/check-permissions.sh
          scripts/check-rtl.sh
          scripts/check-ui-strings.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
