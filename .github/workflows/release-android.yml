name: release-android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build signed artefacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease --no-daemon

      - name: Verify baseline profile is embedded
        run: scripts/check-baseline-profile.sh

      - name: Guards
        run: |
          scripts/check-apk-size.sh
          scripts/check-forbidden-strings.sh

      - name: Collect artefacts and hashes
        id: hash
        run: |
          mkdir -p dist
          find android/app/build/outputs -name '*.apk' -o -name '*.aab' | xargs -I{} cp {} dist/
          cd dist && sha256sum * > SHA256SUMS
          echo "sha256=$(sha256sum *arm64-v8a*.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  verify-reproducible:
    needs: build
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild from a clean checkout
        run: ./gradlew :android:app:assembleRelease --no-daemon

      - name: Compare hashes
        run: |
          rebuilt=$(find android/app/build/outputs -name '*arm64-v8a*.apk' -print -quit)
          actual=$(sha256sum "$rebuilt" | cut -d' ' -f1)
          expected="${{ needs.build.outputs.sha256 }}"
          echo "expected $expected"
          echo "rebuilt  $actual"
          test "$actual" = "$expected"
