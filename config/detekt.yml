    constructorThreshold: 7
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  NestedBlockDepth:
    active: true
    threshold: 3
  TooManyFunctions:
    active: true
    thresholdInClasses: 12
    thresholdInFiles: 12

style:
  active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
