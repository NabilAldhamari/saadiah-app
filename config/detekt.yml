build:
  maxIssues: 0

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  CommentOverPrivateFunction:
    active: true
  CommentOverPrivateProperty:
    active: true
  OutdatedDocumentation:
    active: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 30
    # A composable is a tree of declarations rather than imperative logic, so its line
    # count does not measure the complexity this rule exists to catch. Splitting one
    # purely to satisfy the limit produces wrappers that exist for no reader's benefit.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 5
    constructorThreshold: 7
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  NestedBlockDepth:
    active: true
    threshold: 3
  TooManyFunctions:
    active: true
    thresholdInClasses: 12
    thresholdInFiles: 12

style:
  active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  ForbiddenComment:
    active: true
    comments:
      - reason: "TODO comments rot. Open an issue."
        value: "TODO:"
      - reason: "FIXME comments rot. Open an issue."
        value: "FIXME:"
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 3
  UnusedPrivateMember:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    # Composables are PascalCase by Compose convention, not by accident.
    ignoreAnnotated: ['Composable']
  ClassNaming:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  LateinitUsage:
    active: true
